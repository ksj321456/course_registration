<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>로그인</title>
</head>
<body>

<h1>로그인</h1>

<form th:action="@{/auth/login}" method="post" th:object="${loginRequestDto}">

    <div>
        아이디:
        <input type="text" th:field="*{loginId}">
    </div>

    <div>
        비밀번호:
        <input type="password" th:field="*{password}">
    </div>

    <button type="submit">
        로그인
    </button>

</form>

</body>
</html>
