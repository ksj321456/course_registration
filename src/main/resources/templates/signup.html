<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>회원가입</title>
</head>
<body>

<h1>회원가입</h1>

<form th:action="@{/auth/signup}"
      method="post"
      th:object="${signUpRequestDto}">

    <div>
        아이디:
        <input type="text" th:field="*{loginId}">

        <div
                th:if="${#fields.hasErrors('loginId')}"
                th:errors="*{loginId}"
                style="color:red">
        </div>
    </div>

    <div>
        비밀번호:
        <input type="password" th:field="*{password}">

        <div
                th:if="${#fields.hasErrors('password')}"
                th:errors="*{password}"
                style="color:red">
        </div>
    </div>

    <div>
        이름:
        <input type="text" th:field="*{userName}">

        <div
                th:if="${#fields.hasErrors('userName')}"
                th:errors="*{userName}"
                style="color:red">
        </div>
    </div>

    <div>
        전화번호:
        <input type="text" th:field="*{userPhoneNumber}">

        <div
                th:if="${#fields.hasErrors('userPhoneNumber')}"
                th:errors="*{userPhoneNumber}"
                style="color:red">
        </div>
    </div>

    <div>
        학과:

        <select th:field="*{department}">

            <option value="">
                학과 선택
            </option>

            <option
                    th:each="department : ${departments}"
                    th:value="${department}"
                    th:text="${department.description}">
            </option>

        </select>

        <div
                th:if="${#fields.hasErrors('department')}"
                th:errors="*{department}"
                style="color:red">
        </div>
    </div>

    <button type="submit">
        회원가입
    </button>

</form>

</body>
</html>
